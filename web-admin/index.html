<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Administrativo - FYAG SpA</title>
    
    <!-- Bootstrap 5.3 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Hoja de estilos CSS externa -->
    <link rel="stylesheet" href="css/admin-style.css">
</head>
<body>

    <!-- Cabecera Superior: Logotipo y Título del Portal -->
    <header class="d-flex align-items-center justify-content-between p-4 w-100">
        <div class="d-flex align-items-center">
            <!-- Contenedor del logotipo de la empresa -->

            <div class="d-flex align-items-center">
                <a href="https://frioyagroindustria.cl/">
                    <img src="img/logo.png" alt="FYAG Frío y Agroindustria"
                    style="height: 80px; width: auto;">
                </a>

            </div>

            <!-- Contenedor del título -->
        </div>
        <h1 class="h3 fw-bold text-institutional m-0" style="font-size: 50px;">Portal Administrativo</h1>
        <div style="width: 110px;"></div>
    </header>

    <!-- Contenedor Principal: Tarjeta Central de Inicio de Sesión -->
    <main class="container d-flex justify-content-center align-items-center my-auto">
        <div class="card login-card p-4 p-md-5">
            <h3 class="fw-normal text-dark mb-1">Bienvenido/a</h3>
            <p class="text-muted small mb-4">Ingrese sus credenciales</p>
            
            <!-- Formulario de acceso -->
            <form id="loginForm" action="dashboard.html" method="GET">
                <div class="mb-3">
                    <input type="text" id="username" class="form-control py-2 text-muted" placeholder="Nombre de usuario o RUT" required>
                </div>
                <div class="mb-3">
                    <input type="password" id="password" class="form-control py-2 text-muted" placeholder="Contraseña" required>
                </div>
                <div class="text-end mb-4">
                    <a href="#" class="text-primary text-decoration-none small">¿Olvidó su contraseña?</a>
                </div>
                <button type="submit" class="btn btn-institutional w-100 py-2 fw-medium shadow-sm">Iniciar sesión</button>
            </form>

            <!-- Nota de seguridad institucional (JWT) -->
            <div class="text-center mt-4">
                <small class="text-muted jwt-security-text">Acceso protegido mediante autenticación segura JWT • FYAG 2026</small>
            </div>
        </div>
    </main>

    <footer class="p-3"></footer>

    <!-- Bootstrap 5.3 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Archivo JavaScript externo -->
    <script src="js/admin.js"></script>
</body>
</html>
