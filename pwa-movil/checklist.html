<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checklist técnico | FYAG Móvil</title>
  <!-- Bootstrap 5.3-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/checklist.css">
</head>
<body class="bg-light">

  <!-- Encabezado fijo -->
  <header class="background text-white sticky-top shadow-sm">
    <div class="container py-2 d-flex align-items-center gap-2">
      <a href="index.html" class="btn btn-outline-light btn-sm" aria-label="Volver">&larr;</a>
      <div class="flex-grow-1">
        <div class="fw-bold">Checklist técnico</div>
        <div class="small" id="ordenInfo">Orden N° 0000 · Cliente</div>
      </div>
    </div>
    <!-- Avance -->
    <div class="progress rounded-0" style="height: 8px;" role="progressbar" aria-label="Avance del checklist">
      <div class="progress-bar bg-warning" id="barra" style="width: 0%"></div>
    </div>
  </header>

  <main class="container py-3 pb-5 mb-5">

    <!-- Categoría de faena -->
    <label for="categoria" class="form-label fw-bold">Categoría de faena</label>
    <select id="categoria" class="form-select form-select-lg mb-3">
      <option value="camara">Cámara frigorífica</option>
      <option value="tunel">Túnel de congelado</option>
      <option value="clima">Climatización industrial</option>
    </select>

    <!-- JavaScript dibuja los ítems según la categoría -->
    <div id="listaItems" class="d-grid gap-3"></div>

    <!-- Aviso de bloqueo (rojo) -->
    <div id="aviso" class="alert alert-danger mt-3 d-none" role="alert"></div>
  </main>

  <!-- Barra inferior fija con el botón principal -->
  <footer class="fixed-bottom bg-white border-top p-3">
    <button id="btnContinuar" class="btn btn-success btn-lg w-100" disabled>
      Continuar a materiales
    </button>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/checklist.js"></script>
</body>
</html>
