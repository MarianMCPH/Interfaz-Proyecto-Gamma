<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paso 1: Formulario Técnico | FYAG Móvil</title>
  <!-- Usar EXACTAMENTE el mismo enlace de Bootstrap 5.3 que definió el grupo en la base -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/checklist.css">
</head>
<body>
  <header class="encabezado sticky-top">
    <a href="itinerario.html" class="volver" aria-label="Volver">&larr;</a>
    <h1>Paso 1: Formulario Técnico</h1>
  </header>

  <div class="franja">
    <img src="img/logo.png" alt="Frío y Agroindustria SpA" class="logo">
    <span class="orden">ID: #105 - <span id="tipoServicio">Climatización</span></span>
    <span class="pill-linea" id="estadoRed">En línea</span>
  </div>

  <main class="contenido">
    <div class="tarjeta">
      <label for="categoria" class="form-label etiqueta">Protocolo de la faena</label>
      <select id="categoria" class="form-select">
        <option value="clima" selected>Climatización</option>
        <option value="camara">Cámara de frío</option>
        <option value="tunel">Túnel de congelado</option>
      </select>
      <div class="progress mt-3" style="height:8px" role="progressbar" aria-label="Avance del protocolo">
        <div class="progress-bar" id="barra" style="width:0%"></div>
      </div>
    </div>

    <div id="listaItems"></div>

    <div id="aviso" class="alert-rojo d-none" role="alert"></div>
  </main>

  <footer class="barra-inferior">
    <button id="btnContinuar" class="btn-indigo" disabled>Siguiente: Consumo de Insumos</button>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/checklist.js"></script>
</body>
</html>
