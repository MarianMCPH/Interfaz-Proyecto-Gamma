<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#393b89">
    <title>FYAG - Detalle de Faena</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/mobil-style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body class="detail-body">
    <main id="detailPage">
        <header class="detail-header">
            <a class="detail-back" href="home.html" aria-label="Volver al inicio">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2Z"/></svg>
            </a>
            <div class="detail-brand">
                <img src="img/logo.png" alt="FYAG" class="detail-logo">
                <h1>Detalle de Faena</h1>
            </div>
        </header>

        <section class="detail-content" aria-label="Información de la faena">
            <article id="workSummary" class="work-summary">
                <h2 id="workHeading"></h2>
                <hr>
                <h3 id="workType"></h3>
                <p><strong>Cliente:</strong> <span id="workClient"></span></p>
                <p><strong>Dirección:</strong> <span id="workAddress"></span></p>
                <p><strong>Contacto:</strong> <span id="workContact"></span></p>
                <p><strong>Horario:</strong> <span id="workTime"></span></p>
                <p><strong>Presupuesto:</strong> <span id="workBudget"></span></p>
                <p><strong>Ubicación:</strong> <span id="workLocation"></span></p>
            </article>

            <article class="technical-card">
                <h2>Instrucciones Técnicas</h2>
                <div class="technical-copy">
                    <p id="workInstructions"></p>
                    <p class="equipment-title"><strong>Equipos y especificaciones:</strong></p>
                    <ul id="workEquipment"></ul>
                </div>
            </article>

            <div id="gpsFeedback" class="gps-feedback alert alert-warning d-none" role="status" aria-live="polite"></div>
            <div class="detail-actions">
                <button id="directionsButton" class="directions-button" type="button">¿Cómo llegar?</button>
                <button id="startWorkButton" class="start-work-button" type="button">Iniciar Faena</button>
            </div>
        </section>
    </main>
    <script src="js/mobil.js"></script>
</body>
</html>
