<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#393b89">
    <title>FYAG - Consumo de Insumos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/mobil-style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body class="supplies-body">
    <header class="technical-form-header">
        <a id="backToTechnicalForm" class="form-back" href="formulario.html?id=105" aria-label="Volver al formulario técnico">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2Z"/></svg>
        </a>
        <div class="technical-header-brand">
            <h1>Paso 2: Consumo de Insumos</h1>
        </div>
    </header>

    <div class="form-workbar">
        <img src="img/logo.png" alt="FYAG" class="form-work-logo">
        <span id="suppliesWorkId">ID: #105 - Climatización</span>
        <span id="suppliesConnectionStatus" class="online-status"><span aria-hidden="true">●</span> En línea</span>
    </div>

    <main class="supplies-main">
        <div id="suppliesMessage" class="supplies-message d-none" role="status" aria-live="polite"></div>
        <form id="suppliesForm" novalidate>
            <div id="materialsList" class="materials-list"></div>
            <div class="supplies-toolbar">
                <button id="addMaterialButton" class="small-supply-button" type="button">
                    <span aria-hidden="true">+</span> Agregar Material
                </button>
                <button id="requestSuppliesButton" class="small-supply-button" type="button">
                    <svg class="supply-warning-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 2 1 21h22L12 2Zm1 15h-2v-2h2v2Zm0-4h-2V8h2v5Z"/>
                    </svg>
                    Solicitar Insumos
                </button>
            </div>
            <div class="supplies-navigation">
                <a id="backToTechnicalFormBottom" href="formulario.html?id=105">Atrás: Formulario</a>
                <button type="submit">Siguiente: Evidencia Fotográfica</button>
            </div>
        </form>
        <p class="form-save-note">El avance se guarda automáticamente en este dispositivo.</p>
    </main>

    <dialog id="requestSuppliesDialog" class="supplies-dialog">
        <form id="supplyRequestForm">
            <h2>Solicitar Insumos</h2>
            <label for="supplyRequestText">Indique los materiales que necesita</label>
            <textarea id="supplyRequestText" rows="3" required placeholder="Material y cantidad requerida"></textarea>
            <div class="dialog-actions">
                <button id="cancelSupplyRequest" type="button">Cancelar</button>
                <button type="submit">Guardar solicitud</button>
            </div>
        </form>
    </dialog>
    <script src="js/mobil.js"></script>
</body>
</html>
