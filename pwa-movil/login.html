<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FYAG - Login Portal de Terreno</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Tu archivo CSS personalizado -->
    <link rel="stylesheet" href="css/mobil-style.css">
    
    <!-- Archivos PWA -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Librería Bcrypt.js para simular encriptación -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>
</head>
<body class="login-body">

<div class="login-container">
    <div class="topbar">
        <img src="img/logo.png" alt="Logo FYAG" class="brand-logo">
        <h3 class="header-title">Portal de Terreno</h3>
    </div>

    <div class="card-login">
        <h4 class="welcome-text">Bienvenido/a</h4>
        <p class="instruction-text">Ingrese sus credenciales</p>

        <div id="error-message" class="alert alert-danger d-none py-2 text-center" style="font-size: 0.85rem;" role="alert">
            Credenciales incorrectas.
        </div>

        <form id="loginForm">
            <input type="text" class="form-control form-login" id="username" placeholder="Nombre de usuario o RUT" required>
            <input type="password" class="form-control form-login" id="password" placeholder="Contraseña" required>
            
            <a href="#" class="forgot-password">¿Olvidó su contraseña?</a>
            <button type="submit" class="btn btn-login">Iniciar sesión</button>
        </form>

        <p class="footer-text">Acceso protegido mediante autenticación segura JWT • FYAG 2026</p>
    </div>
</div>

<!-- Tu archivo JS personalizado -->
<script src="js/mobil.js"></script>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
