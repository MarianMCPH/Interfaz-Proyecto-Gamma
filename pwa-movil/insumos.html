<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Insumos | FYAG Móvil</title>
  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/insumos.css">
</head>
<body class="bg-light">

  <header class="background text-white sticky-top shadow-sm">
    <div class="container py-2 d-flex align-items-center gap-2">
      <a href="checklist.html" class="btn btn-outline-light btn-sm" aria-label="Volver al checklist">&larr;</a>
      <div class="flex-grow-1">
        <div class="fw-bold">Consumo de insumos</div>
        <div class="small">Bodega móvil · descuento de stock</div>
      </div>
      <span class="badge text-bg-warning fs-6" id="contador">0</span>
    </div>
  </header>

  <main class="container py-3 pb-5 mb-5">

    <!-- Buscador -->
    <input type="search" id="buscador" class="form-control form-control-lg mb-3"
           placeholder="Buscar por nombre o código" aria-label="Buscar insumo">

    <!-- Lista del catálogo -->
    <div id="catalogo" class="d-grid gap-3"></div>
    <p id="sinResultados" class="text-center text-muted mt-4 d-none">No se encontraron insumos.</p>

    <!-- Resumen de lo seleccionado -->
    <div class="card mt-4 shadow-sm">
      <div class="card-header fw-bold">Resumen del consumo</div>
      <ul class="list-group list-group-flush" id="resumen">
        <li class="list-group-item text-muted">Aún no has seleccionado insumos.</li>
      </ul>
    </div>

    <div id="aviso" class="alert alert-danger mt-3 d-none" role="alert"></div>
  </main>

  <footer class="fixed-bottom bg-white border-top p-3">
    <button id="btnConfirmar" class="btn btn-success btn-lg w-100">Confirmar consumo</button>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/insumos.js"></script>
</body>
</html>
