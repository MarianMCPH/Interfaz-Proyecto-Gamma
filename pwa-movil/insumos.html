<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paso 2: Consumo de Insumos | FYAG Móvil</title>
  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/insumos.css">
</head>
<body>
  <header class="encabezado sticky-top">
    <a href="checklist.html" class="volver" aria-label="Volver">&larr;</a>
    <h1>Paso 2: Consumo de Insumos</h1>
  </header>

  <div class="franja">
    <img src="img/logo.png" alt="Frío y Agroindustria SpA" class="logo">
    <span class="orden">ID: #105 - Climatización</span>
    <span class="pill-linea" id="estadoRed">En línea</span>
  </div>

  <main class="contenido">
    <div class="tarjeta">
      <h2 class="titulo-tarjeta">REBAJA DE MATERIALES Y REPUESTOS</h2>
      <div id="filas"></div>
      <div id="aviso" class="alert-rojo d-none" role="alert"></div>
      <div class="d-flex flex-wrap gap-2 justify-content-center mt-3">
        <button id="btnAgregar" class="btn-chico"><i class="bi bi-plus-lg me-1"></i>Agregar Material</button>
        <button id="btnSolicitar" class="btn-chico"><i class="bi bi-exclamation-triangle-fill me-1"></i>Solicitar Insumos</button>
      </div>
    </div>
  </main>

  <footer class="barra-inferior">
    <a href="checklist.html" class="btn-indigo">Atrás: Formulario</a>
    <button id="btnConfirmar" class="btn-indigo">Siguiente: Evidencia Fotográfica</button>
  </footer>

  <!-- Solicitud de insumos sin stock -->
  <div class="modal fade" id="modalSolicitud" tabindex="-1" aria-labelledby="tituloSol" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
      <div class="modal-header"><h2 class="modal-title fs-5" id="tituloSol">Solicitar insumos</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
      <div class="modal-body">
        <label for="solTexto" class="form-label">Detalle lo que necesita (artículo y cantidad)</label>
        <textarea id="solTexto" class="form-control" rows="3"></textarea>
        <div class="invalid-feedback">Escriba el detalle de la solicitud.</div>
      </div>
      <div class="modal-footer"><button type="button" class="btn-indigo" id="btnEnviarSol">Enviar solicitud</button></div>
    </div></div>
  </div>
  <div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3">
    <div id="toastOk" class="toast text-bg-success" role="status"><div class="toast-body">Solicitud enviada al administrador.</div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/insumos.js"></script>
</body>
</html>
