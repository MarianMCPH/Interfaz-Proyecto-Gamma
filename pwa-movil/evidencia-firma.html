<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paso 3: Evidencia Fotográfica - PWA Terreno</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #eef1f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .app-header-proto {
            background-color: #343a40;
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
        }
        .app-header-proto a {
            color: white;
            font-size: 1.4rem;
            text-decoration: none;
            margin-right: 15px;
        }
        .card-proto {
            background-color: #ffffff;
            border: 2px solid #adb5bd;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.04);
        }
        .upload-box {
            border: 2px dashed #6c757d;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            background-color: #f8f9fa;
            color: #495057;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .upload-box:hover {
            background-color: #e9ecef;
        }
        #firmaCanvas {
            width: 100%;
            height: 160px;
            background-color: #f8f9fa;
            border: 2px dashed #ced4da;
            border-radius: 8px;
            touch-action: none;
        }
    </style>
</head>
<body>

    <header id="header-bar" class="py-3 px-3 shadow-sm text-white" style="background-color: #3b429f;">
        <div class="container-fluid d-flex align-items-center justify-content-between">
            <a href="#" class="btn btn-outline-light btn-sm rounded-circle p-2 d-flex align-items-center justify-content-center" style="width: 38px; height: 38px;">
                <i class="bi bi-arrow-left fs-5"></i>
            </a>
            <div class="d-flex align-items-center gap-2">
                <img src="img/logo.png" alt="FYAG" style="height: 38px; width: auto;" class="bg-white rounded p-1">
                <h4 class="m-0 fw-bold text-white fs-4">Paso 3: Evidencia Fotográfica</h4>
            </div>
            <div style="width: 38px;"></div>
        </div>
    </header>

    <div class="container py-3">
        
        <div class="d-flex align-items-center mb-3 px-1 text-secondary small fw-bold">
            <i class="bi bi-envelope fs-5 me-2 text-dark"></i> ID: #105 - Climatización 
            <span class="ms-auto text-success"><i class="bi bi-circle-fill small me-1"></i> En Línea</span>
        </div>

        <div class="card card-proto p-3 mb-3">
            <h6 class="text-uppercase text-secondary fw-bold small text-center pb-2 border-bottom mb-3">
                Evidencia Fotográfica de Faena
            </h6>

            <div class="upload-box mb-3" onclick="document.getElementById('fileAntes').click();">
                <i class="bi bi-camera me-1"></i> <strong>Subir Foto Antes</strong>
                <input type="file" id="fileAntes" class="d-none" accept="image/*">
            </div>

            <div class="upload-box mb-3" onclick="document.getElementById('fileDespues').click();">
                <i class="bi bi-camera-fill me-1"></i> <strong>Subir Foto Después</strong>
                <input type="file" id="fileDespues" class="d-none" accept="image/*">
            </div>

            <div class="mb-2">
                <label class="form-label small fw-bold text-secondary mb-1">Observación</label>
                <textarea class="form-control bg-light" rows="2" placeholder="Ingrese comentarios de la faena..."></textarea>
            </div>
        </div>

        <div class="d-grid mb-4">
            <button class="btn btn-secondary text-white fw-bold py-2 rounded-pill shadow-sm" style="background-color: #6c757d;">
                Adjuntar Imagen Adicional
            </button>
        </div>
    </div>

    <div class="p-3 fixed-bottom d-flex gap-2">
        <a href="#" class="btn text-white w-50 fw-bold py-2 small shadow rounded-pill" style="background-color: #3b429f; border: 0;">
            <i class="bi bi-arrow-left"></i> Atrás: Consumo de Insumos
        </a>
        <a href="firma.html" class="btn text-white w-50 fw-bold py-2 small shadow rounded-pill" style="background-color: #3b429f; border: 0;">
            Siguiente: Firma Mandate <i class="bi bi-arrow-right"></i>
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/mobile.js"></script>
</body>
</html>
