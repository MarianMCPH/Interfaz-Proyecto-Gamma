<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Terreno - FYAG Móvil</title>
    
    <!-- Bootstrap 5.3 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Estilos específicos para el login móvil -->
    <link rel="stylesheet" href="css/mobile-style.css">
</head>
<body class="pwa-login-body">

    <!-- Encabezado Móvil: Logotipo y Título del Portal de Terreno -->
    <header class="pwa-login-header text-center pt-4 pb-2">
        <div class="d-flex justify-content-center mb-3">

                <div class="d-flex align-items-center p-1 shadow-sm logo-box">
                    <a href="https://frioyagroindustria.cl/">
                        <img src="img/logo.png" alt="FYAG Frío y Agroindustria" style="height: 60px; width: auto;">
                    </a>
                </div>

        </div>
        <h1 class=" fw-bold text-institutional m-0">Portal de Terreno</h1>
    </header>

    <!-- Contenedor Principal: Tarjeta Central de Inicio de Sesión -->
    <main class="container d-flex justify-content-center align-items-center my-auto px-3 py-3">
        <div class="card login-card p-4 shadow-sm w-100">
            <h3 class="fw-normal text-dark mb-1 fs-5">Bienvenido/a</h3>
            <p class="text-muted small mb-3">Ingrese sus credenciales</p>
            
            <!-- Formulario de Acceso Móvil -->
            <form id="pwaLoginForm" action="itinerario.html" method="GET">
                <div class="mb-3">
                    <input type="text" id="pwaUser" class="form-control py-2 text-muted small" placeholder="Nombre de usuario o RUT" required>
                </div>
                <div class="mb-3">
                    <input type="password" id="pwaPass" class="form-control py-2 text-muted small" placeholder="Contraseña" required>
                </div>
                <div class="text-end mb-3">
                    <a href="#" class="text-primary text-decoration-none small">¿Olvidó su contraseña?</a>
                </div>
                <button type="submit" class="btn btn-institutional w-100 py-2 fw-medium shadow-sm">Iniciar sesión</button>
            </form>

            <!-- Nota de Seguridad Institucional (JWT) -->
            <div class="text-center mt-3">
                <small class="text-muted" style="font-size: 10px;">Acceso protegido mediante autenticación segura JWT • FYAG 2026</small>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Lógica JS del Login Móvil -->
    <script src="js/mobile.js"></script>
</body>
</html>
