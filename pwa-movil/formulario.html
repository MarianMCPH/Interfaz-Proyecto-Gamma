<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#393b89">
    <title>FYAG - Formulario Técnico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/mobil-style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body class="technical-form-body">
    <header class="technical-form-header">
        <a id="backToWork" class="form-back" href="home.html" aria-label="Volver">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2Z"/></svg>
        </a>
        <div class="technical-header-brand">
            <h1>Paso 1: Formulario Técnico</h1>
        </div>
    </header>

    <div class="form-workbar">
        <img src="img/logo.png" alt="FYAG" class="form-work-logo">
        <span id="formWorkId">ID de faena</span>
        <span id="connectionStatus" class="online-status"><span aria-hidden="true">●</span> En línea</span>
    </div>

    <main class="technical-form-main">
        <div id="formMessage" class="form-validation-message d-none" role="alert" aria-live="polite">
            <span class="form-warning-icon" aria-hidden="true">!</span>
            <span id="formMessageText"></span>
        </div>
        <form id="technicalForm" novalidate>
            <div id="technicalChecklist" class="technical-checklist"></div>
            <div class="observation-card">
                <label for="technicalObservations">Observaciones técnicas</label>
                <textarea id="technicalObservations" rows="3" placeholder="Registre observaciones de la faena..."></textarea>
            </div>
            <button class="next-step-button" type="submit">Siguiente: Consumo de Insumos</button>
        </form>
        <p class="form-save-note">El avance se guarda automáticamente en este dispositivo.</p>
    </main>
    <script src="js/mobil.js"></script>
</body>
</html>
